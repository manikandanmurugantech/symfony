monolog:
    channels:
        - deprecation
        - performance   # Dedicated channel for performance metrics

    handlers:
        main:
            type:   fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50

        nested:
            type:      stream
            path:      '%kernel.logs_dir%/%kernel.environment%.log'
            level:     debug
            formatter: monolog.formatter.json

        performance:
            type:      stream
            path:      '%kernel.logs_dir%/performance.log'
            level:     debug
            channels:  [performance]
            formatter: monolog.formatter.json

        console:
            type:      console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type:  fingers_crossed
                action_level: error
                handler: nested
            nested:
                type:  stream
                path:  '%kernel.logs_dir%/test.log'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type:        fingers_crossed
                action_level: error
                handler:      nested
                buffer_size: 50
            nested:
                type:      stream
                path:      php://stderr
                level:     debug
                formatter: monolog.formatter.json
            performance:
                type:      stream
                path:      php://stderr
                level:     info
                channels:  [performance]
                formatter: monolog.formatter.json
